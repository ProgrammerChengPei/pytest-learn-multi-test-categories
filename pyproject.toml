[tool.pytest.ini_options]
# Pytest Configuration / Pytest配置文件

# Test patterns / 测试匹配模式
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Test paths / 测试路径
testpaths = ["tests"]

# Markers / 标记定义
markers = [
    "flash: Flash/Firmware tests / 刷写/固件测试",
    "interface: Interface tests / 接口测试",
    "function: Function tests / 功能测试",
    "performance: Performance tests / 性能测试",
]

# Output options / 输出选项
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--maxfail=5",
    "--color=yes",
    "-ra",
    "--html=test_artifacts/report.html",
    "--self-contained-html",
]

# Logging configuration / 日志配置
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "test_artifacts/pytest.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

# Coverage configuration (optional) / 覆盖率配置（可选）
# addopts = "--cov=src --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
